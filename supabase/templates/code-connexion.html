<!-- Modèle à coller dans Supabase > Authentication > Email Templates,
     pour « Magic Link » ET pour « Confirm signup ».
     Sujet conseillé : Ton code Fonte : {{ .Token }} -->
<div style="font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #151618;">
  <p style="font-size: 18px; font-weight: 700; margin: 0 0 16px;">Fonte</p>
  <p style="font-size: 15px; margin: 0 0 12px;">Voici ton code de connexion :</p>
  <p style="font-size: 36px; font-weight: 800; letter-spacing: 8px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="font-size: 15px; margin: 0 0 24px;">Saisis-le dans l'app. Il est valable une heure.</p>
  <p style="font-size: 14px; margin: 0 0 8px; color: #5b5e64;">Sur ordinateur, tu peux aussi cliquer ici :</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display: inline-block; background: #ff6b1a; color: #151618; font-weight: 700; text-decoration: none; padding: 12px 20px; border-radius: 6px;">Me connecter</a>
  </p>
  <p style="font-size: 13px; color: #5b5e64; margin: 0;">Tu n'as rien demandé ? Ignore cet e-mail, personne ne pourra se connecter sans ce code.</p>
</div>
